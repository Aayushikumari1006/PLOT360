version: '3.8'

services:
  # PostGIS 16 with PostgreSQL 16
  postgis:
    image: postgis/postgis:16-3.4
    container_name: plot360-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plot360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plot360secure}
      POSTGRES_DB: ${POSTGRES_DB:-plot360}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plot360} -d ${POSTGRES_DB:-plot360}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for background queue (optional)
  redis:
    image: redis:7-alpine
    container_name: plot360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plot360-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plot360}:${POSTGRES_PASSWORD:-plot360secure}@postgis:5432/${POSTGRES_DB:-plot360}
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      DATA_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET:-plot360-super-secret-jwt-key-for-auth-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      POSTGIS_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local
